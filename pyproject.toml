version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pywebview>=6.2.1",
    "streamlit>=1.64.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
